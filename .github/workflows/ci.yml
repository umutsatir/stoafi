name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec prettier --check .

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm test

      # SPEC acceptance: core coverage stays at or above 90% (enforced in the core vitest config).
      - run: pnpm --filter @stoafi/core test:coverage

      - run: pnpm --filter @stoafi/web build
